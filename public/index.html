<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MariaDB Data Lab</title>
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Primary">
      <div class="brand">
        <img src="/img/icon.svg" alt="" width="28" height="28">
        <div>
          <div class="brand-name">MariaDB Data Lab</div>
          <div class="brand-sub" id="brand-db">not connected</div>
        </div>
      </div>
      <nav>
        <ul class="nav" id="nav"></ul>
      </nav>
      <div class="sidebar-foot">
        <label class="theme-toggle">
          <span>Theme</span>
          <select id="theme-select" aria-label="Color theme">
            <option value="system">System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
      </div>
    </aside>
    <div class="main-wrap">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Toggle navigation" aria-controls="sidebar" aria-expanded="false">☰</button>
        <h1 id="page-title">Overview</h1>
        <div class="topbar-status" id="topbar-status" aria-live="polite"></div>
      </header>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
</body>
</html>
